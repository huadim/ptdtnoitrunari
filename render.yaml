# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: eduschool-na-ri
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    autoDeployTrigger: "off"
    healthCheckPath: /healthz/
    preDeployCommand: sh deploy/render-release.sh
    envVars:
      - key: DJANGO_SECRET_SEED
        generateValue: true
      - key: DJANGO_TRUST_PROXY
        value: "1"
      - key: POSTGRES_SSLMODE
        value: require
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: eduschool-na-ri-db
          property: connectionString
      - key: EDUSCHOOL_PRINCIPAL_USERNAME
        sync: false
      - key: EDUSCHOOL_PRINCIPAL_PASSWORD
        sync: false

databases:
  - name: eduschool-na-ri-db
    databaseName: eduschool
    user: eduschool
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
