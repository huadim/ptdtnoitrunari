name: Kiểm thử PostgreSQL
on: [push, pull_request]
permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eduschool
          POSTGRES_PASSWORD: postgres-test
          POSTGRES_DB: eduschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduschool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: postgres-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
      - run: node --test tests/access.test.cjs
      - name: Kiểm thử Docker và khởi tạo trường lần đầu
        env:
          DATABASE_URL: postgresql://eduschool:postgres-test@127.0.0.1:5432/eduschool
          RENDER_EXTERNAL_HOSTNAME: eduschool-test.onrender.com
          RENDER_EXTERNAL_URL: https://eduschool-test.onrender.com
          DJANGO_TRUST_PROXY: "1"
          WEB_CONCURRENCY: "1"
          EDUSCHOOL_PRINCIPAL_USERNAME: principal@example.invalid
        run: |
          set -euo pipefail
          docker build -t eduschool-verify .
          export DJANGO_SECRET_SEED="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export EDUSCHOOL_PRINCIPAL_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          runtime=(--network host -e DATABASE_URL -e RENDER_EXTERNAL_HOSTNAME -e RENDER_EXTERNAL_URL
                   -e DJANGO_SECRET_SEED -e DJANGO_TRUST_PROXY -e WEB_CONCURRENCY
                   -e EDUSCHOOL_PRINCIPAL_USERNAME -e PORT=10000)
          docker run --rm "${runtime[@]}" -e EDUSCHOOL_PRINCIPAL_PASSWORD eduschool-verify sh deploy/render-release.sh
          docker run --rm "${runtime[@]}" eduschool-verify sh deploy/render-release.sh
          docker run --rm "${runtime[@]}" -e EDUSCHOOL_PRINCIPAL_PASSWORD eduschool-verify python manage.py shell -c '
          import os
          from django.contrib.auth import authenticate
          user = authenticate(username=os.environ["EDUSCHOOL_PRINCIPAL_USERNAME"], password=os.environ["EDUSCHOOL_PRINCIPAL_PASSWORD"])
          assert user is not None and user.membership.role == "principal"
          '
          docker run -d --name eduschool-verify "${runtime[@]}" eduschool-verify
          trap 'docker logs eduschool-verify && docker rm -f eduschool-verify' EXIT
          local_url=http://127.0.0.1:10000
          curl_opts=(-fsS --retry 12 --retry-connrefused --retry-delay 2 -H "Host: $RENDER_EXTERNAL_HOSTNAME")
          curl "${curl_opts[@]}" "$local_url/healthz/" | grep -Fx ok
          curl "${curl_opts[@]}" -H 'X-Forwarded-Proto: https' "$local_url/dang-nhap/" > /tmp/eduschool-login.html
          grep -Fq 'Đăng nhập' /tmp/eduschool-login.html
          css="$(sed -n 's@.*href="\(/static/school/app\.[^"]*\.css\)".*@\1@p' /tmp/eduschool-login.html)"
          test -n "$css"
          curl "${curl_opts[@]}" -H 'X-Forwarded-Proto: https' "$local_url$css" > /tmp/eduschool.css
          grep -Fq -- '--brand' /tmp/eduschool.css
